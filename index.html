<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareBuddy - Live Transcription</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            padding: 40px;
        }

        h1 { color: #1e3a8a; margin-bottom: 6px; }
        p  { color: #64748b; margin-bottom: 20px; }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #1e3a8a;
            cursor: pointer;
            background: #1e3a8a;
            color: #fff;
        }
        button:disabled { opacity: 0.45; cursor: default; }
        #toggleBtn.recording { background: #dc2626; border-color: #dc2626; }

        #status {
            font-size: 14px;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 6px;
            background: #e0f2fe;
            color: #0369a1;
            margin-bottom: 14px;
        }
        #status.error { background: #fee2e2; color: #b91c1c; }

        /* ── Transcript container ──────────────────── */
        #transcript {
            background: #fff;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            height: 520px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .turn-block {
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .turn-block.ai {
            border-color: #6366f1;
            background: #f0f9ff;
        }

        .turn-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            font-size: 0.75em;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: #f1f5f9;
            color: #94a3b8;
            border-bottom: 1px solid #e2e8f0;
        }

        .turn-block.live .turn-header { background: #fef2f2; color: #ef4444; }
        .turn-block.ai .turn-header { background: #e0e7ff; color: #4f46e5; }

        .turn-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #94a3b8;
        }
        .turn-block.live  .turn-dot { background: #ef4444; animation: pulse 1s infinite; }
        .turn-block.done  .turn-dot { background: #22c55e; }
        .turn-block.ai .turn-dot { background: #6366f1; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        /* Body */
        .turn-body {
            padding: 12px 14px;
            font-size: 1em;
            line-height: 1.75;
            color: #1e293b;
        }

        /* Each committed sentence sits on its own line */
        .sentence {
            display: block;
        }
        .sentence + .sentence {
            margin-top: 3px;
        }

        /* Partial preview — greyed out, at the bottom */
        .partial-line {
            display: block;
            color: #94a3b8;
            margin-top: 4px;
            font-style: italic;
        }

        /* ── Loose info / error lines ──────────────── */
        .info-line  { color: #0369a1; font-style: italic; font-size: 0.88em; padding: 2px 4px; }
        .error-line { color: #b91c1c; font-size: 0.88em; padding: 2px 4px; }
    </style>
</head>
<body>
    <h1>CareBuddy - Live Transcription</h1>
    <p>Click Start Turn to begin speaking. Click End Turn to stop and send.</p>

    <div class="controls">
        <button id="toggleBtn">Start Turn</button>
    </div>

    <div id="status">Status: Ready</div>
    <div id="transcript"></div>
    <script>
        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let activeTurnBlock = null;
        let turnCounter = 0;

        const toggleBtn = document.getElementById('toggleBtn');
        const statusEl = document.getElementById('status');
        const transcriptEl = document.getElementById('transcript');

        function setStatus(text, isError = false) {
            statusEl.textContent = "Status: " + text;
            statusEl.className = isError ? 'error' : '';
        }

        function scrollBottom() {
            transcriptEl.scrollTop = transcriptEl.scrollHeight;
        }

        function createTurnBlock() {
            turnCounter++;
            const block = document.createElement('div');
            block.className = 'turn-block live';

            const header = document.createElement('div');
            header.className = 'turn-header';
            const dot = document.createElement('span'); dot.className = 'turn-dot';
            const label = document.createElement('span'); label.textContent = `Turn ${turnCounter}`;

            header.appendChild(dot); header.appendChild(label);

            const body = document.createElement('div'); body.className = 'turn-body';

            block.appendChild(header); block.appendChild(body);
            transcriptEl.appendChild(block);
            scrollBottom();
            return block;
        }

        function createAIMessageBlock(text) {
            const block = document.createElement('div');
            block.className = 'turn-block ai';

            const header = document.createElement('div');
            header.className = 'turn-header';
            const dot = document.createElement('span'); dot.className = 'turn-dot';
            const label = document.createElement('span'); label.textContent = 'CareBuddy';

            header.appendChild(dot); header.appendChild(label);

            const body = document.createElement('div');
            body.className = 'turn-body';
            const span = document.createElement('span');
            span.className = 'sentence';
            span.textContent = text;

            body.appendChild(span);
            block.appendChild(header);
            block.appendChild(body);

            transcriptEl.appendChild(block);
            scrollBottom();
        }

        function appendSentence(block, text) {
            const body = block.querySelector('.turn-body');
            const partial = body.querySelector('.partial-line');
            if (partial) partial.remove();

            const span = document.createElement('span');
            span.className = 'sentence';
            span.textContent = text;
            body.appendChild(span);
            scrollBottom();
        }

        function upsertPartial(block, text) {
            const body = block.querySelector('.turn-body');
            let partial = body.querySelector('.partial-line');
            if (!partial) {
                partial = document.createElement('span');
                partial.className = 'partial-line';
                body.appendChild(partial);
            }
            partial.textContent = text;
            scrollBottom();
        }

        function sealTurnBlock(block, fullText) {
            block.classList.remove('live');
            block.classList.add('done');
            const body = block.querySelector('.turn-body');
            body.innerHTML = `<span class="sentence">${fullText}</span>`;
            scrollBottom();
        }

        // Improved End Turn Logic
        async function endCurrentTurn() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            setStatus('Ending turn...');

            try {
                ws.send(JSON.stringify({ type: "stop" }));
                // Give backend time to process flush_turn + CareBuddy
                await new Promise(r => setTimeout(r, 1200));
            } catch (e) {
                console.error("Error sending stop", e);
            }

            // Now safely cleanup audio
            if (processor) { processor.disconnect(); processor = null; }
            if (mediaStream) { 
                mediaStream.getTracks().forEach(t => t.stop()); 
                mediaStream = null; 
            }
            if (audioContext) { 
                await audioContext.close().catch(() => {}); 
                audioContext = null; 
            }

            toggleBtn.textContent = 'Start Turn';
            toggleBtn.classList.remove('recording');
        }

        async function startStreaming() {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 16000 }
            });

            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const source = audioContext.createMediaStreamSource(mediaStream);
            processor = audioContext.createScriptProcessor(4096, 1, 1);

            processor.onaudioprocess = (e) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                const inputData = e.inputBuffer.getChannelData(0);
                const pcm16 = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    pcm16[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32768));
                }
                ws.send(pcm16.buffer);
            };

            source.connect(processor);
            processor.connect(audioContext.destination);
        }

        async function start() {
            setStatus('Connecting...');
            try {
                ws = new WebSocket(`wss://${window.location.host}/ws/transcribe`);

                ws.onopen = async () => {
                    await startStreaming();
                    setStatus('🎤 Speaking - Press End Turn when done');
                    toggleBtn.textContent = 'End Turn';
                    toggleBtn.classList.add('recording');
                    activeTurnBlock = createTurnBlock();
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        const type = data.type?.toLowerCase();
                        const text = data.text?.trim();

                        switch (type) {
                            case "partial":
                                if (text && activeTurnBlock) upsertPartial(activeTurnBlock, text);
                                break;
                            case "final":
                                if (text && activeTurnBlock) appendSentence(activeTurnBlock, text);
                                break;
                            case "turn_complete":
                                if (activeTurnBlock) {
                                    sealTurnBlock(activeTurnBlock, text || '(no speech detected)');
                                    activeTurnBlock = null;
                                }
                                setStatus('CareBuddy is thinking...');
                                break;
                            case "ai_response":
                                createAIMessageBlock(text);
                                setStatus('Ready - Click Start Turn to speak again');
                                break;
                            case "error":
                                console.error("Backend error:", text);
                                break;
                        }
                    } catch (e) {
                        console.error("Parse error", e);
                    }
                };

                ws.onclose = () => {
                    console.log("WebSocket closed");
                    toggleBtn.textContent = 'Start Turn';
                    toggleBtn.classList.remove('recording');
                };

                ws.onerror = () => setStatus('Connection error', true);

            } catch (err) {
                setStatus('Failed to connect', true);
            }
        }

        // Button Handler
        toggleBtn.onclick = async () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                await endCurrentTurn();
            } else {
                await start();
            }
        };
    </script>
</body>
</html>
