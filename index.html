<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareBuddy - Live Transcription</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            padding: 40px;
        }

        h1 { color: #1e3a8a; margin-bottom: 6px; }
        p  { color: #64748b; margin-bottom: 20px; }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        button,
        select {
            height: 40px;
            border-radius: 6px;
            border: 1px solid #1e3a8a;
            font-size: 15px;
        }

        button {
            padding: 0 18px;
            cursor: pointer;
            background: #1e3a8a;
            color: #fff;
        }

        select {
            min-width: 160px;
            padding: 0 10px;
            background: #fff;
            color: #1e293b;
        }

        button:disabled,
        select:disabled { opacity: 0.45; cursor: default; }
        #toggleBtn.recording { background: #dc2626; border-color: #dc2626; }

        #status {
            font-size: 14px;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 6px;
            background: #e0f2fe;
            color: #0369a1;
            margin-bottom: 14px;
        }
        #status.error { background: #fee2e2; color: #b91c1c; }

        #transcript {
            background: #fff;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            height: 520px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .turn-block {
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .turn-block.ai {
            border-color: #6366f1;
            background: #f0f9ff;
        }

        .turn-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            font-size: 0.75em;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: #f1f5f9;
            color: #94a3b8;
            border-bottom: 1px solid #e2e8f0;
        }

        .turn-block.live .turn-header { background: #fef2f2; color: #ef4444; }
        .turn-block.ai .turn-header { background: #e0e7ff; color: #4f46e5; }

        .turn-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #94a3b8;
        }
        .turn-block.live  .turn-dot { background: #ef4444; animation: pulse 1s infinite; }
        .turn-block.done  .turn-dot { background: #22c55e; }
        .turn-block.ai .turn-dot { background: #6366f1; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .turn-body {
            padding: 12px 14px;
            font-size: 1em;
            line-height: 1.75;
            color: #1e293b;
        }

        .sentence {
            display: block;
        }
        .sentence + .sentence {
            margin-top: 3px;
        }

        .partial-line {
            display: block;
            color: #94a3b8;
            margin-top: 4px;
            font-style: italic;
        }

        .error-line { color: #b91c1c; font-size: 0.88em; padding: 2px 4px; }
    </style>
</head>
<body>
    <h1>CareBuddy - Live Transcription</h1>
    <p>Click Start Turn to begin speaking. Click End Turn to stop and send.</p>

    <div class="controls">
        <select id="providerSelect" aria-label="Speech-to-text provider">
            <option value="speechmatics">Speechmatics</option>
            <option value="assemblyai">AssemblyAI</option>
            <option value="deepgram">Deepgram</option>
        </select>
        <button id="toggleBtn">Start Turn</button>
    </div>

    <div id="status">Status: Ready</div>
    <div id="transcript"></div>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <script>
        let room = null;
        let activeTurnBlock = null;
        let turnCounter = 0;
        let isRecording = false;

        const LK = window.LivekitClient;
        const encoder = new TextEncoder();
        const decoder = new TextDecoder();
        const toggleBtn = document.getElementById('toggleBtn');
        const providerSelect = document.getElementById('providerSelect');
        const statusEl = document.getElementById('status');
        const transcriptEl = document.getElementById('transcript');

        function setStatus(text, isError = false) {
            statusEl.textContent = "Status: " + text;
            statusEl.className = isError ? 'error' : '';
        }

        function scrollBottom() {
            transcriptEl.scrollTop = transcriptEl.scrollHeight;
        }

        function createTurnBlock() {
            turnCounter++;
            const block = document.createElement('div');
            block.className = 'turn-block live';

            const header = document.createElement('div');
            header.className = 'turn-header';
            const dot = document.createElement('span');
            dot.className = 'turn-dot';
            const label = document.createElement('span');
            label.textContent = `Turn ${turnCounter}`;

            header.appendChild(dot);
            header.appendChild(label);

            const body = document.createElement('div');
            body.className = 'turn-body';

            block.appendChild(header);
            block.appendChild(body);
            transcriptEl.appendChild(block);
            scrollBottom();
            return block;
        }

        function createAIMessageBlock(text) {
            const block = document.createElement('div');
            block.className = 'turn-block ai';

            const header = document.createElement('div');
            header.className = 'turn-header';
            const dot = document.createElement('span');
            dot.className = 'turn-dot';
            const label = document.createElement('span');
            label.textContent = 'CareBuddy';

            header.appendChild(dot);
            header.appendChild(label);

            const body = document.createElement('div');
            body.className = 'turn-body';
            const span = document.createElement('span');
            span.className = 'sentence';
            span.textContent = text;

            body.appendChild(span);
            block.appendChild(header);
            block.appendChild(body);

            transcriptEl.appendChild(block);
            scrollBottom();
        }

        function appendSentence(block, text) {
            const body = block.querySelector('.turn-body');
            const partial = body.querySelector('.partial-line');
            if (partial) partial.remove();

            const span = document.createElement('span');
            span.className = 'sentence';
            span.textContent = text;
            body.appendChild(span);
            scrollBottom();
        }

        function upsertPartial(block, text) {
            const body = block.querySelector('.turn-body');
            let partial = body.querySelector('.partial-line');
            if (!partial) {
                partial = document.createElement('span');
                partial.className = 'partial-line';
                body.appendChild(partial);
            }
            partial.textContent = text;
            scrollBottom();
        }

        function sealTurnBlock(block, fullText) {
            block.classList.remove('live');
            block.classList.add('done');
            const body = block.querySelector('.turn-body');
            body.innerHTML = '';
            const span = document.createElement('span');
            span.className = 'sentence';
            span.textContent = fullText;
            body.appendChild(span);
            scrollBottom();
        }

        function appendError(text) {
            const line = document.createElement('div');
            line.className = 'error-line';
            line.textContent = text;
            transcriptEl.appendChild(line);
            scrollBottom();
        }

        function handleServerEvent(data) {
            const type = data.type?.toLowerCase();
            const text = data.text?.trim();

            switch (type) {
                case "partial":
                    if (text && activeTurnBlock) upsertPartial(activeTurnBlock, text);
                    break;
                case "final":
                    if (text && activeTurnBlock) appendSentence(activeTurnBlock, text);
                    break;
                case "turn_complete":
                    if (activeTurnBlock) {
                        sealTurnBlock(activeTurnBlock, text || '(no speech detected)');
                        activeTurnBlock = null;
                    }
                    setStatus('CareBuddy is thinking...');
                    break;
                case "ai_response":
                    if (text) createAIMessageBlock(text);
                    setStatus(isRecording ? 'Speaking' : 'Ready');
                    break;
                case "error":
                    appendError(text || 'Backend error');
                    break;
            }
        }

        async function connectRoom() {
            if (!LK) {
                throw new Error('LiveKit browser SDK did not load');
            }

            const provider = providerSelect.value;
            const response = await fetch(`/livekit/session?provider=${encodeURIComponent(provider)}`);
            if (!response.ok) {
                const detail = await response.text();
                throw new Error(detail || 'Unable to create LiveKit session');
            }

            const session = await response.json();
            room = new LK.Room();

            room.on(LK.RoomEvent.DataReceived, (payload, participant, kind, topic) => {
                if (topic && topic !== 'carebuddy.events') return;
                try {
                    handleServerEvent(JSON.parse(decoder.decode(payload)));
                } catch (error) {
                    console.error('Invalid server event', error);
                }
            });

            room.on(LK.RoomEvent.Disconnected, () => {
                room = null;
                isRecording = false;
                activeTurnBlock = null;
                toggleBtn.textContent = 'Start Turn';
                toggleBtn.classList.remove('recording');
                providerSelect.disabled = false;
                setStatus('Disconnected');
            });

            await room.connect(session.url, session.token);
            providerSelect.disabled = true;
        }

        async function sendControl(type) {
            if (!room) return;
            const payload = encoder.encode(JSON.stringify({ type }));
            await room.localParticipant.publishData(payload, {
                reliable: true,
                topic: 'carebuddy.control',
            });
        }

        async function startTurn() {
            toggleBtn.disabled = true;
            setStatus('Connecting...');

            try {
                if (!room) {
                    await connectRoom();
                }

                activeTurnBlock = createTurnBlock();
                await sendControl('start');
                await room.localParticipant.setMicrophoneEnabled(true, {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true,
                });

                isRecording = true;
                toggleBtn.textContent = 'End Turn';
                toggleBtn.classList.add('recording');
                setStatus('Speaking');
            } catch (error) {
                console.error(error);
                setStatus('Failed to start', true);
                if (activeTurnBlock) {
                    activeTurnBlock.remove();
                    activeTurnBlock = null;
                }
                if (room) {
                    await room.disconnect().catch(() => {});
                }
            } finally {
                toggleBtn.disabled = false;
            }
        }

        async function endTurn() {
            if (!room) return;

            toggleBtn.disabled = true;
            setStatus('Ending turn...');

            try {
                await room.localParticipant.setMicrophoneEnabled(false);
                await new Promise(resolve => setTimeout(resolve, 300));
                await sendControl('stop');
                isRecording = false;
                toggleBtn.textContent = 'Start Turn';
                toggleBtn.classList.remove('recording');
            } catch (error) {
                console.error(error);
                setStatus('Failed to end turn', true);
            } finally {
                toggleBtn.disabled = false;
            }
        }

        toggleBtn.onclick = async () => {
            if (isRecording) {
                await endTurn();
            } else {
                await startTurn();
            }
        };

        window.addEventListener('beforeunload', () => {
            if (room) room.disconnect();
        });
    </script>
</body>
</html>
